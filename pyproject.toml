[project]
name = "calpipe"
version = "2.0.0"
description = "PRTS 日历：可扩展的数据源→ICS 生成框架"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "icalendar>=5.0.0",
    "requests>=2.28.0",
]

[project.scripts]
calpipe = "calpipe.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
