# PRTS 日历 — 明日方舟卡池与活动 ICS（每小时）
name: PRTS calendar

on:
  push:
    branches: [main, master]
  schedule:
    - cron: "30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Generate PRTS ICS
        run: |
          mkdir -p output

          uv run calpipe gen \
            --type prts_wiki --id prts_limited_recruit --name '明日方舟 限时寻访' \
            --params '{"page_title":"卡池一览/限时寻访"}' --output output

          uv run calpipe gen \
            --type prts_wiki --id prts_standard --name '明日方舟 常驻标准寻访' \
            --params '{"page_title":"卡池一览/常驻标准寻访","append_year":true,"years":[2019,2020,2021,2022,2023,2024,2025,2026],"api_url":"https://m.prts.wiki/api.php","mobileformat":true}' \
            --output output

          uv run calpipe gen \
            --type prts_wiki --id prts_mid_recruit --name '明日方舟 常驻中坚寻访与甄选' \
            --params '{"page_title":"卡池一览/常驻中坚寻访&中坚甄选","append_year":true,"years":[2023,2024,2025,2026],"api_url":"https://m.prts.wiki/api.php","mobileformat":true}' \
            --output output

          uv run calpipe gen \
            --type prts_wiki --id prts_activity --name '明日方舟 活动一览' \
            --params '{"page_title":"活动一览","api_url":"https://m.prts.wiki/api.php","mobileformat":true,"parse_mode":"activity"}' \
            --output output

      - name: Split and release
        run: |
          mkdir -p output_archive output_latest
          for f in output/*.ics; do
            case "$f" in
              *_latest.ics|*_all.ics) ;;
              *) cp "$f" output_archive/ ;;
            esac
          done
          cp output/*_latest.ics output/*_all.ics output_latest/

          # --- archive ---
          if gh release view prts-archive &>/dev/null; then
            for name in $(gh release view prts-archive --json assets -q '.assets[].name'); do
              gh release delete-asset prts-archive "$name" --yes
            done
          fi
          gh release create prts-archive output_archive/*.ics \
            --title "每年归档 (PRTS)" --notes "按年份归档的 PRTS 卡池与活动 ICS。" \
            --prerelease --replace 2>/dev/null || \
          gh release upload prts-archive output_archive/*.ics --clobber

          # --- latest ---
          if gh release view prts-latest &>/dev/null; then
            for name in $(gh release view prts-latest --json assets -q '.assets[].name'); do
              gh release delete-asset prts-latest "$name" --yes
            done
          fi
          gh release create prts-latest output_latest/*.ics \
            --title "当年 + 全量 (PRTS)" --notes "当年订阅用 *_latest.ics，全量 *_all.ics。" \
            --latest --replace 2>/dev/null || \
          gh release upload prts-latest output_latest/*.ics --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep alive (push heartbeat to live branch)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin live 2>/dev/null || true
          git checkout -B live origin/live 2>/dev/null || git checkout --orphan live
          date > .heartbeat
          git add .heartbeat
          git commit -m "heartbeat $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
          git push origin live --force
