# 发薪日 + 节假日 + 华为月末周六 ICS 日历（每月 1 日）
name: Payday calendar

on:
  push:
    branches: [main, master]
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Generate payday ICS
        run: |
          mkdir -p output

          uv run calpipe gen \
            --script examples/chinese_holidays.py --id chinese_holidays --name '中国法定节假日' \
            --params '{"years":[2024,2025,2026]}' --output output

          uv run calpipe gen \
            --script examples/company_payday.py --id company_payday --name '公司发薪日' \
            --params '{"pay_day":15,"strategy":"advance","years":[2024,2025,2026]}' --output output

          uv run calpipe gen \
            --script examples/huawei_last_saturday.py --id huawei_last_saturday --name '华为月末周六加班' \
            --params '{"years":[2024,2025,2026]}' --output output

      - name: Release latest + all
        run: |
          # pick only _latest.ics and _all.ics
          mkdir -p release
          cp output/*_latest.ics output/*_all.ics release/
          echo "assets in release:"
          ls release/

          if gh release view payday &>/dev/null; then
            for name in $(gh release view payday --json assets -q '.assets[].name'); do
              gh release delete-asset payday "$name" --yes
            done
          fi
          gh release create payday release/*.ics \
            --title "发薪日日历" \
            --notes "节假日、发薪日、月末加班 ICS。订阅用 *_latest.ics（当年）。" \
            --latest --replace 2>/dev/null || \
          gh release upload payday release/*.ics --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep alive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin live 2>/dev/null || true
          git checkout -B live origin/live 2>/dev/null || git checkout --orphan live
          date > .heartbeat
          git add .heartbeat
          git commit -m "heartbeat $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
          git push origin live --force
